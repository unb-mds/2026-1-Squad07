name: Metrics Dashboard

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"
  push:
    branches:
      - dev
    paths:
      - ".github/workflows/metrics.yml"
      - "docs/metricas/collect_metrics.py"
      - "docs/metricas/index.html"
      - "docs/metricas/AGENT.md"

permissions:
  contents: write

concurrency:
  group: metrics-dashboard
  cancel-in-progress: false

jobs:
  update-metrics:
    name: Update productivity metrics
    runs-on: ubuntu-latest

    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install --upgrade pip PyGithub

      - name: Collect metrics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python docs/metricas/collect_metrics.py

      - name: Commit metrics.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/metricas/metrics.json
          if git diff --cached --quiet; then
            echo "No metrics changes to commit."
          else
            git commit -m "chore: atualiza métricas de produtividade [bot]"
            git pull --rebase origin dev
            git push origin dev
          fi

      - name: Publish metrics.json to GitHub Pages
        run: |
          cp docs/metricas/metrics.json /tmp/metrics.json
          git fetch origin gh-pages
          git worktree add -b gh-pages-update gh-pages-worktree origin/gh-pages
          cp /tmp/metrics.json gh-pages-worktree/metricas/metrics.json
          cd gh-pages-worktree
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metricas/metrics.json
          if git diff --cached --quiet; then
            echo "No published metrics changes to commit."
          else
            git commit -m "chore: publica métricas atualizadas [bot]"
            git pull --rebase origin gh-pages
            git push origin HEAD:gh-pages
          fi
