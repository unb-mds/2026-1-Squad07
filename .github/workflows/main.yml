name: CI — Lint, Format & Tests

on:
  pull_request:
    branches: ["main", "dev"]
  push:
    branches: ["main", "dev"]

jobs:
  code-quality:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Instalar ferramentas
        run: pip install flake8 black
      - name: Black (formatação)
        run: black --check --diff backend/
      - name: Flake8 (estilo)
        run: flake8 backend/ --max-line-length=88 --extend-ignore=E501,W503

  tests:
    name: Testes Backend
    runs-on: ubuntu-latest
    needs: code-quality
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
        working-directory: backend
      - name: Configurar Prisma
        run: |
          prisma generate --schema=prisma/schema.prisma
          prisma db push --schema=prisma/schema.prisma
        working-directory: backend
      - name: Rodar testes com coverage
        run: |
          pytest tests/ -v --tb=short --cov=app --cov-report=html --cov-report=lcov --cov-report=term-missing --cov-fail-under=90
        working-directory: backend

  frontend-tests:
    name: Testes Frontend
    runs-on: ubuntu-latest
    needs: code-quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependências
        run: npm ci
        working-directory: frontend
      - name: Rodar linter do frontend
        run: npm run lint
        working-directory: frontend
      - name: Rodar testes com coverage
        run: npm run test:coverage
        working-directory: frontend
